# PackMatrix Desktop — Zero-Tolerance Supply Chain & Dependency Defense Policy
# Governed by SDLC Gate 0: Section 0.2

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu"
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# Section 0.2: Security Vulnerabilities & Advisories
# Zero-tolerance: aborts on any vulnerability advisory
[advisories]
unmaintained = "workspace"
ignore = []

# Section 0.2: Banned Licenses (Exhaustive allow list: strictly prohibits viral copyleft GPLv3/AGPL)
[licenses]
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
]

[licenses.private]
ignore = true

# Section 0.2: Bans & Duplicate Version Prevention
# Ban duplicate major versions of core libraries (serde, rusqlite, tokio)
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
